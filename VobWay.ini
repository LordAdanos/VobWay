; =============================================================================
; VobWay v2.1 - settings
; =============================================================================
; In short: with the shipped values you do not need to change anything here.
; For testing and bug reports, only set Diag=1.
;
; Where:  next to VobWay.dll in Gothic II\System\Autorun\.
;         If it is missing there, VobWay.ini is looked for in Gothic II\System\,
;         then the [VOBWAY] block in Gothic.ini.
; When:   read once at game start. Changes take effect after a restart.
; Values: lines starting with ; are comments.
;         Switches: 1 = on, 0 = off (also on/off, yes/no, true/false).
;         Numbers may use a decimal point or comma (45.5 or 45,5).
;         Lengths in cm (1 Gothic unit = 1 cm).
;         An invalid value or a value outside the allowed range is ignored,
;         then the default applies.
; =============================================================================

[VOBWAY]

; -----------------------------------------------------------------------------
; Enabled - plugin on or off
; -----------------------------------------------------------------------------
; Simple: 0 = Gothic runs as without the plugin. Good for comparing.
; Exact:  with 0 nothing in the game is changed; with Diag=1 the log only holds
;         the load lines.
; Default: 1
Enabled=1

; -----------------------------------------------------------------------------
; MaxSlope - how steep a vob surface may be
; -----------------------------------------------------------------------------
; Simple: 0 = as steep as on normal level ground (world mesh). Usually right.
; Exact:  limit angle in degrees above which a vob surface counts as too steep.
;         0 = the value the NPC also uses for world mesh (50 degrees for humans).
;         A value above 0 only applies to vob surfaces, world mesh is not affected.
;         Above about 60 degrees helps little: the engine barely pushes the NPC
;         up that steep.
; Allowed: 0 to below 89. Default: 0
MaxSlope=0

; -----------------------------------------------------------------------------
; The four check sites
; -----------------------------------------------------------------------------
; Simple: leave all at 1. Set one to 0 only to narrow down a problem.
; Exact:  at these sites the engine decides whether the NPC must avoid (turn on
;         the spot). With 1 the DLL also checks the ground there; with 0 the
;         engine's decision alone applies again.

; CheckRay: the forward ray hits a vob (typical: vob ramp, vob stairs).
; Default: 1
CheckRay=1

; CheckContact: the NPC's body touches a vob.
; Default: 1
CheckContact=1

; CheckWorld: the ray passes a vob and hits steep level mesh behind it,
; e.g. a vob ramp leaning against a cliff made of world mesh.
; Then world mesh and all vobs are probed together. The step is only allowed
; when a vob forms the ground; pure world mesh always stays with the engine.
; Also used as a second try for CheckRay/CheckContact (ramp onto another vob
; or onto world mesh).
; Default: 1
CheckWorld=1

; CheckAvoid: avoid mode. Once an NPC has avoided, the engine keeps checking
; whether its original way is free again. With 1, vob ground counts as free
; there if it is walkable, so the NPC finds its way back to the ramp.
; Default: 1
CheckAvoid=1

; -----------------------------------------------------------------------------
; Probing the ground
; -----------------------------------------------------------------------------
; Simple: the DLL "feels" the ground in front of the NPC with rays from top to
;         bottom, like with a stick, and checks whether it can be walked up.
; Exact:  probe points lie ProbeStep apart in front of the NPC, up to ProbeReach.
;         Every surface hit must be flatter than MaxSlope. From point to point
;         the ground may rise at most as much as the slope allows over that
;         distance, plus StepHeight. After a point without a hit (gap), the slope
;         of the next surface hit counts; flat ground may then only be StepHeight
;         higher.

; ProbeStep: distance between two probe points in cm.
; Smaller = more exact, but more work per NPC.
; Allowed: 5 to 100. Default: 20
ProbeStep=20

; ProbeReach: how far in front of the NPC the ground is probed, in cm.
; About as far as the engine checks ahead. There are at least 1 and at most
; 80 probe points (ProbeReach divided by ProbeStep).
; Allowed: 20 to 400. Default: 160
ProbeReach=160

; ProbeUp: how high above the feet each probe starts, in cm.
; Must be higher than the highest point the NPC should reach within ProbeReach.
; Allowed: 50 to 500. Default: 180
ProbeUp=180

; ProbeDown: how far below the feet each probe reaches, in cm.
; Ground lying deeper is not found and counts as a gap.
; Allowed: 10 to 500. Default: 100
ProbeDown=100

; StepHeight: extra edge height in cm allowed between two probe points.
; Simple: larger = small edges and ledges are stepped over more easily,
; smaller = stricter.
; Allowed: 0 to 100. Default: 30
StepHeight=30

; -----------------------------------------------------------------------------
; Walls and railings
; -----------------------------------------------------------------------------
; Simple: two horizontal rays forward detect walls and railings.
;         If one of them hits something too steep, the vob stays an obstacle.
; Exact:  one ray at body centre (where the engine also checks), one at
;         WallRayHeight above the feet.

; WallRayLength: length of both wall rays in cm. 0 switches them off.
;   130 = as long as the engine's ray for humans. In the simulation, vob stairs,
;         edges and ledges then behave like the same shape made of world mesh,
;         also where world mesh makes the NPC turn (e.g. stairs with 25-30 cm
;         steps).
;    60 = more generous: stairs with steps up to about 30 cm and small ledges on
;         ramps are walked. In exchange the NPC avoids walls only about 60 cm in
;         front of them.
; Tip: if vob stairs do not work, try 60.
; Allowed: 0 to 300. Default: 130
WallRayLength=130

; WallRayHeight: height of the second wall ray above the feet in cm.
; Detects railings and parapets the first ray would pass over.
; Allowed: 0 to 300. Default: 100
WallRayHeight=100

; -----------------------------------------------------------------------------
; Log
; -----------------------------------------------------------------------------
; Diag: 1 = writes VobWay.log next to the DLL. 0 = the DLL writes nothing at all.
; Simple: 1 for testing, 0 in normal play.
; Exact:  the first line shows that the DLL was loaded, which Gothic2.exe is
;         running and whether its code matches. Then "VobWay v2.1: active" with
;         all settings, or "No patch" with the reason. In game two kinds of lines
;         are added:
;         - decisions of the DLL: "Ray", "Contact", "World" or "Avoid" with
;           walkable=1 (way free) or walkable=0 (engine decides).
;         - refusals of the engine: "CanGo=2 avoid", "CanGo=3 jump/climb",
;           "CanGo=4 turn back (drop)". Free steps are not logged.
;         Every line gives the positions (x y z, as in the Spacer) of NPC and vob.
;         Refusals also give the engine's collision hints as text:
;         ceiling, slope, step-too-high, drop.
;         Identical consecutive lines are written only once.
;         The file is never cleared; delete it now and then.
;         If VobWay.log is missing despite Diag=1, the DLL was not loaded
;         (usually Union is missing) or this ini was not found.
; Default: 0
Diag=0

; DiagMaxLines: at most this many log lines per game start.
; Allowed: 1 to 1000000. Default: 2000
DiagMaxLines=2000
